name: Deploy prototype to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Nexus Hub workshop dependencies
        run: npm install --prefix NexusHub/workshop --no-audit --no-fund --no-package-lock
      - name: Make original stylesheet imports resolve
        run: ln -s workshop/node_modules NexusHub/node_modules
      - name: Build the actual React UI components
        run: npm run build --prefix NexusHub/workshop
      - name: Include compiled Nexus Hub without dependencies
        run: |
          cp -R NexusHub/dist/. NexusHub/
          rm -f NexusHub/node_modules
          rm -rf NexusHub/workshop/node_modules NexusHub/dist
          test -s NexusHub/index.html
          test -d NexusHub/assets
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
